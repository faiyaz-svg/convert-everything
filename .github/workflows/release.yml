name: Release

# Push a tag such as v0.1.0 to build the installer and publish it on the Releases page.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Cache engine downloads
        uses: actions/cache@v6
        with:
          path: .engine-cache
          key: engines-${{ hashFiles('scripts/engines.lock.json') }}
      - run: npm ci
      - name: Download the engines
        # cmd, so Windows PowerShell does not inherit PowerShell 7's module path.
        shell: cmd
        run: npm run engines
      - name: Run every conversion through the engines
        run: npm run test:convert
      - name: Build the installer
        run: npm run release
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          installer=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          sha256sum "$installer" > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "$installer" SHA256SUMS.txt \
            --title "Convert Everything ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
